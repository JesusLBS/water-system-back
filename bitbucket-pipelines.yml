image: node:18

pipelines:
  branches:
    feature/postman:
      - step:
          name: Validate, convert OpenAPI -> Postman and update collection
          caches:
            - node
          script:
            - set -euo pipefail

            - echo "1) Node & npm versions"
            - node -v
            - npm -v

            - echo "2) Install tools"
            - npm install -g @apidevtools/swagger-cli openapi-to-postmanv2

            - echo "3) Ensure collections directory exists"
            - mkdir -p postman/collections

            - echo "4) Validate OpenAPI"
            - swagger-cli validate index.yaml || (echo "OpenAPI validation failed" && exit 1)

            - echo "5) Convert OpenAPI to Postman collection"
            - openapi2postmanv2 -s index.yaml -o postman/collections/collection-to-upload.json -p || (echo "Conversion failed" && exit 1)

            - echo "6) Show generated file"
            - ls -lh postman/collections/collection-to-upload.json

            - echo "7) Sync collection to Postman using Node script"
            - node syncPostman.js

            - echo "8) Done"
