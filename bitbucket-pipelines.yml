image: alpine:3.19

pipelines:
  branches:
    feature/postman:
      - step:
          name: Sync Postman Collection
          script:
            # 1) Install required tools
            - apk add --no-cache curl jq

            # 2) Validate JSON file exists
            - echo "1) Validating JSON collection file..."
            - COLLECTION_FILE="postman/collections/water-system-back-v1.json"
            - if [ ! -f "$COLLECTION_FILE" ]; then echo "❌ Collection file not found"; exit 1; fi
            - echo "✅ Found: $COLLECTION_FILE"
            - jq '.info.name' "$COLLECTION_FILE"

            # 3) Check if collection exists on Postman
            - echo "2) Check if collection exists on Postman"
            - STATUS_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                -X GET "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_UID" \
                -H "X-Api-Key: $POSTMAN_API_KEY")

            # 4) Update or create collection
            - |
              if [ "$STATUS_CODE" = "200" ]; then
                echo "✅ Collection exists, updating..."
                jq -c '{collection: .}' "$COLLECTION_FILE" | \
                  curl -s -X PUT "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_UID" \
                    -H "X-Api-Key: $POSTMAN_API_KEY" \
                    -H "Content-Type: application/json" \
                    -d @- | jq
              else
                echo "❌ Collection does not exist, creating in workspace: $POSTMAN_WORKSPACE_ID..."
                jq -c '{collection: .}' "$COLLECTION_FILE" | \
                  curl -s -X POST "https://api.getpostman.com/collections?workspace=$POSTMAN_WORKSPACE_ID" \
                    -H "X-Api-Key: $POSTMAN_API_KEY" \
                    -H "Content-Type: application/json" \
                    -d @- | jq
              fi

            - echo "✅ Postman collection sync completed successfully"
