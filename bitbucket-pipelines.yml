image: node:18

pipelines:
  branches:
    feature/postman:
      - step:
          name: Validate, convert OpenAPI -> Postman and update collection
          caches:
            - node
          script:
            - echo "1) Node & npm versions"
            - node -v
            - npm -v

            - echo "2) Install tools"
            - npm install -g @apidevtools/swagger-cli openapi-to-postmanv2 jq

            - echo "3) Validate OpenAPI"
            - swagger-cli validate index.yaml || (echo "OpenAPI validation failed" && exit 1)

            - echo "4) Convert index.yaml -> postman/collections/collection-to-upload.json"
            - mkdir -p postman/collections
            - openapi2postmanv2 -s index.yaml -o postman/collections/collection-to-upload.json -p || (echo "Conversion failed" && exit 1)

            - echo "5) Show generated file"
            - ls -lh postman/collections/collection-to-upload.json
            - jq -r '.info.name + " / " + (.info._postman_id // "no-id")' postman/collections/collection-to-upload.json || true

            - echo "6) Update Postman collection (UID: $POSTMAN_COLLECTION_UID)"
            - |
              RESP=$(curl -s -w "\n%{http_code}" -X PUT "https://api.getpostman.com/collections/$POSTMAN_COLLECTION_UID" \
                -H "X-Api-Key: $POSTMAN_API_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @postman/collections/collection-to-upload.json)
              echo "$RESP" > postman_update_response.txt
              echo "Response:"
              tail -n +1 postman_update_response.txt
              CODE=$(tail -n 1 postman_update_response.txt)
              if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
                echo "Postman update failed with code $CODE"
                cat postman_update_response.txt
                exit 1
              fi

            - echo "7) Done"
