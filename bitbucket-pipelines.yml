image: node:20-alpine

pipelines:
  branches:
    feature/postman:
      - step:
          name: Sync Postman Collection
          script:
            # 1) Install required tools
            - apk add --no-cache curl jq bash

            # 2) Install OpenAPI converter globally
            - echo "Installing openapi-to-postmanv2..."
            - npm install -g openapi-to-postmanv2

            # 3) Set variables
            - OPENAPI_FILE="index.yaml"
            - TMP_COLLECTION_JSON="postman/collections/water-system-back-v1.json"
            - API_URL="https://api.getpostman.com"

            # 4) Verify OpenAPI file exists
            - |
              if [ ! -f "$OPENAPI_FILE" ]; then
                echo "❌ OpenAPI file not found: $OPENAPI_FILE"
                exit 1
              fi
              echo "✅ OpenAPI file exists: $OPENAPI_FILE"

            # 5) Convert OpenAPI → Postman JSON
            - |
              echo "Converting OpenAPI to Postman JSON..."
              openapi2postmanv2 -s "$OPENAPI_FILE" -o "$TMP_COLLECTION_JSON" -p

              if [ ! -s "$TMP_COLLECTION_JSON" ]; then
                echo "❌ Conversion failed, JSON is empty"
                exit 1
              fi

              COLLECTION_NAME="$(jq -r '.info.name // empty' "$TMP_COLLECTION_JSON")"

              if [ -z "$COLLECTION_NAME" ]; then
                echo "❌ Collection name not found in JSON"
                exit 1
              fi

              echo "✅ Conversion OK. Collection name: $COLLECTION_NAME"

            # 6) Helper function to find UID by name
            - |
              find_uid_by_name() {
                curl -s -X GET "$API_URL/collections" \
                  -H "X-Api-Key: $POSTMAN_API_KEY" \
                | jq -r --arg NAME "$COLLECTION_NAME" \
                  '.collections[] | select(.name==$NAME) | .uid' | head -n1
              }

            # 7) Determine if collection exists
            - |
              TARGET_UID="$POSTMAN_COLLECTION_UID"
              EXISTS=0

              if [ -n "$TARGET_UID" ]; then
                CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  -X GET "$API_URL/collections/$TARGET_UID" \
                  -H "X-Api-Key: $POSTMAN_API_KEY")

                if [ "$CODE" = "200" ]; then
                  EXISTS=1
                else
                  echo "⚠️ UID $TARGET_UID not found, searching by name..."
                  TARGET_UID="$(find_uid_by_name || true)"
                  [ -n "$TARGET_UID" ] && EXISTS=1
                fi
              else
                TARGET_UID="$(find_uid_by_name || true)"
                [ -n "$TARGET_UID" ] && EXISTS=1
              fi

            # 8) Prepare payload
            - |
              PAYLOAD_CMD=(jq -c '{collection: .}' "$TMP_COLLECTION_JSON")

            # 9) Update or create collection
            - |
              if [ $EXISTS -eq 1 ]; then
                echo "Updating existing collection (UID: $TARGET_UID)..."
                "${PAYLOAD_CMD[@]}" | curl -s -X PUT "$API_URL/collections/$TARGET_UID" \
                  -H "X-Api-Key: $POSTMAN_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d @- | jq
              else
                echo "Creating collection in workspace: $POSTMAN_WORKSPACE_ID..."
                "${PAYLOAD_CMD[@]}" | curl -s -X POST "$API_URL/collections?workspace=$POSTMAN_WORKSPACE_ID" \
                  -H "X-Api-Key: $POSTMAN_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d @- | jq
              fi

            # 10) Cleanup
            - |
              rm -f "$TMP_COLLECTION_JSON"
              echo "✅ Postman collection sync completed successfully"