openapi: "3.0.1"
info:
  title: Water System Back
  version: "1.0.0"
  description: "API para autenticación, administración de usuarios, dashboard y catálogos. Paths diseñados para agrupar operaciones sobre el mismo recurso."

servers:
  - url: "{{base_url}}/v1"
    description: "Use environment variable {{base_url}}"

tags:
  - name: auth
    description: "Endpoints de autenticación"
  - name: admin/users
    description: "Operaciones sobre usuarios desde administración"
  - name: dashboard/profile
    description: "Dashboard / perfil"
  - name: admin/socios
    description: "Operaciones sobre socios desde administración"
  - name: admin/water-lines
    description: "Operaciones sobre líneas de agua desde administración"

paths:
  # AUTH
  /auth/login:
    post:
      summary: "Login"
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Auth response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
      security:
        - apiKeyAuth: []

  /auth/logout:
    post:
      summary: "Logout"
      tags: [auth]
      responses:
        "204":
          description: "Logged out"
      security:
        - bearerAuth: []


  # ADMIN / USERS
  /admin/users:
    get:
      summary: "List users (paginated, filterable)"
      tags: [admin/users]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: "Search by name or email"
      responses:
        "200":
          description: "User list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
      security:
        - bearerAuth: []

    post:
      summary: "Create user"
      tags: [admin/users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: "User created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
      security:
        - bearerAuth: []

  /admin/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      summary: "Get user by id"
      tags: [admin/users]
      responses:
        "200":
          description: "User object"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
      security:
        - bearerAuth: []

    patch:
      summary: "Update user (partial)"
      tags: [admin/users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: "User updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
      security:
        - bearerAuth: []

    delete:
      summary: "Delete user (permanent)"
      tags: [admin/users]
      responses:
        "204":
          description: "User permanently deleted"
      security:
        - bearerAuth: []

  /admin/users/{user_id}/activate:
    post:
      summary: "Activate a user"
      tags: [admin/users]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: "User activated successfully"
      security:
        - bearerAuth: []

  /admin/users/{user_id}/deactivate:
    post:
      summary: "Deactivate a user"
      tags: [admin/users]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: "User deactivated successfully"
      security:
        - bearerAuth: []

  # DASHBOARD / PROFILE
  /dashboard/profile:
    get:
      summary: "Get my profile"
      tags: [dashboard/profile]
      responses:
        "200":
          description: "Authenticated user profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
      security:
        - bearerAuth: []

    patch:
      summary: "Edit my profile (partial)"
      tags: [dashboard/profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: "Profile updated"
      security:
        - bearerAuth: []

    post:
      summary: "Update my password"
      tags: [dashboard/profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdate"
      responses:
        "200":
          description: "Password updated"
      security:
        - bearerAuth: []

  # ADMIN / SOCIOS
  /admin/socios:
    get:
      summary: "List socios (paginated, filterable)"
      tags: [admin/socios]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: "Search socios"
      responses:
        "200":
          description: "Socio list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocioListResponse"
      security:
        - bearerAuth: []

    post:
      summary: "Create socio"
      tags: [admin/socios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocioCreate"
      responses:
        "201":
          description: "Socio created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Socio"
      security:
        - bearerAuth: []

  /admin/socios/{socio_id}:
    parameters:
      - $ref: "#/components/parameters/socioId"

    get:
      summary: "Get socio by id"
      tags: [admin/socios]
      responses:
        "200":
          description: "Socio object"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Socio"
      security:
        - bearerAuth: []

    patch:
      summary: "Update socio (partial)"
      tags: [admin/socios]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocioUpdate"
      responses:
        "200":
          description: "Socio updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Socio"
      security:
        - bearerAuth: []

    delete:
      summary: "Delete socio (permanent)"
      tags: [admin/socios]
      responses:
        "204":
          description: "Socio permanently deleted"
      security:
        - bearerAuth: []

  /admin/socios/{socio_id}/activate:
    post:
      summary: "Activate a socio"
      tags: [admin/socios]
      parameters:
        - $ref: "#/components/parameters/socioId"
      responses:
        "200":
          description: "Socio activated successfully"
      security:
        - bearerAuth: []

  /admin/socios/{socio_id}/deactivate:
    post:
      summary: "Deactivate a socio"
      tags: [admin/socios]
      parameters:
        - $ref: "#/components/parameters/socioId"
      responses:
        "200":
          description: "Socio deactivated successfully"
      security:
        - bearerAuth: []

  # ADMIN / WATER LINES
  /admin/water-lines:
    get:
      summary: "List water lines (paginated, filterable)"
      tags: [admin/water-lines]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
          description: "Search water lines"
      responses:
        "200":
          description: "Water line list"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterLineListResponse"
      security:
        - bearerAuth: []

    post:
      summary: "Create water line"
      tags: [admin/water-lines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaterLineCreate"
      responses:
        "201":
          description: "Water line created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterLine"
      security:
        - bearerAuth: []

  /admin/water-lines/options:
    get:
      summary: "Get water lines for select options"
      tags: [admin/water-lines]
      responses:
        "200":
          description: "Water line options list"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaterLineOption"
      security:
        - bearerAuth: []

  /admin/water-lines/{water_line_id}:
    parameters:
      - $ref: "#/components/parameters/waterLineId"

    get:
      summary: "Get water line by id"
      tags: [admin/water-lines]
      responses:
        "200":
          description: "Water line object"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterLine"
      security:
        - bearerAuth: []

    patch:
      summary: "Update water line (partial)"
      tags: [admin/water-lines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaterLineUpdate"
      responses:
        "200":
          description: "Water line updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterLine"
      security:
        - bearerAuth: []

    delete:
      summary: "Delete water line (permanent)"
      tags: [admin/water-lines]
      responses:
        "204":
          description: "Water line permanently deleted"
      security:
        - bearerAuth: []

  /admin/water-lines/{water_line_id}/activate:
    post:
      summary: "Activate a water line"
      tags: [admin/water-lines]
      parameters:
        - $ref: "#/components/parameters/waterLineId"
      responses:
        "200":
          description: "Water line activated successfully"
      security:
        - bearerAuth: []

  /admin/water-lines/{water_line_id}/deactivate:
    post:
      summary: "Deactivate a water line"
      tags: [admin/water-lines]
      parameters:
        - $ref: "#/components/parameters/waterLineId"
      responses:
        "200":
          description: "Water line deactivated successfully"
      security:
        - bearerAuth: []

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: "x-api-key header required"
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Bearer token in Authorization header"

  parameters:
    userId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
      description: "Numeric user ID"
    socioId:
      name: socio_id
      in: path
      required: true
      schema:
        type: integer
      description: "Numeric socio ID"
    waterLineId:
      name: water_line_id
      in: path
      required: true
      schema:
        type: integer
      description: "Numeric water line ID"

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        uid:
          type: string
          example: "{{uid}}"
      required:
        - uid

    AuthResponse:
      type: object
      properties:
        token:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        active:
          type: boolean

    UserCreate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        password:
          type: string
      required:
        - first_name
        - last_name
        - email
        - password

    UserUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        active:
          type: boolean
        action:
          type: string
          enum: ["activate", "deactivate"]
          description: "Optional action alternative to 'active' flag"

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          type: object

    PasswordUpdate:
      type: object
      properties:
        current_password:
          type: string
        new_password:
          type: string
      required:
        - current_password
        - new_password

    Socio:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        active:
          type: boolean

    SocioCreate:
      type: object
      required:
        - userData
        - profileData
        - addressData
        - socioData
      properties:

        userData:
          type: object
          required:
            - uid
            - name
            - email
            - roleId
          properties:
            uid:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            roleId:
              type: integer

        profileData:
          type: object
          required:
            - lastName
            - secondLastName
            - mobile
            - birthdate
          properties:
            lastName:
              type: string
            secondLastName:
              type: string
            mobile:
              type: string
            birthdate:
              type: string
              format: date

        addressData:
          type: object
          required:
            - address
            - city
          properties:
            address:
              type: string
            city:
              type: string

        socioData:
          type: object
          required:
            - totalDependents
          properties:
            totalDependents:
              type: integer
              minimum: 0

      example: "{{socioBody}}"

    SocioUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        active:
          type: boolean
        action:
          type: string
          enum: ["activate", "deactivate"]

    SocioListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Socio"
        meta:
          type: object
